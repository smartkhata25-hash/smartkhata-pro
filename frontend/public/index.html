<!doctype html>
<html lang="en">
  <head>
    <style>
      @media print {
        body {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .no-print {
          display: none !important;
        }

        table {
          overflow: visible !important;
        }

        html,
        body {
          margin: 0;
          padding: 0;
          height: auto;
          overflow: visible !important;
        }

        * {
          box-shadow: none !important;
          overflow: visible !important;
        }

        input,
        textarea {
          border: none !important;
        }

        ::-webkit-scrollbar {
          display: none;
        }

        .scroll-hide {
          overflow: visible !important;
        }

        .print-full {
          max-height: none !important;
          overflow: visible !important;
        }
      }
    </style>

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#000000" />

    <!-- Smart Khata SEO -->
    <title>Smart Khata - Accounting & Business Management Software</title>

    <meta
      name="description"
      content="Smart Khata is an easy-to-use accounting and business management software for managing sales, purchases, customers, suppliers, inventory, expenses, payments, ledgers and business reports."
    />

    <meta
      name="keywords"
      content="Smart Khata, Smart Khata App, accounting software, business accounting software, khata software, ledger software, inventory management, sales management, purchase management"
    />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://smartkhataapp.uk/" />

    <!-- Social Sharing / Open Graph -->
    <meta property="og:title" content="Smart Khata - Accounting & Business Management Software" />

    <meta
      property="og:description"
      content="Manage sales, purchases, customers, suppliers, inventory, expenses, payments and business reports with Smart Khata."
    />

    <meta property="og:url" content="https://smartkhataapp.uk/" />

    <meta property="og:type" content="website" />

    <meta property="og:image" content="https://smartkhataapp.uk/logo.png" />

    <!-- App Icons -->
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>
  </body>
</html>
